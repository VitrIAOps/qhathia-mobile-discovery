[versions]
# --- Build toolchain (aligned with docs/android/android-frontend-standards.md canonical catalog) ---
agp = "9.2.1"
kotlin = "2.3.20"
# Since KSP 2.3.0 the version is standalone — no longer tied to the Kotlin compiler version.
# Do NOT use the old <kotlin>-<patch> format.
ksp = "2.3.6"

# --- App version (semantic versioning + prerelease) — single source of truth for versionName/versionCode ---
# Bump `appVersion` (MAJOR.MINOR.PATCH) here; the build derives versionName ("<appVersion>-<appPrerelease>")
# and versionCode (major*10000 + minor*100 + patch). Prerelease stays SNAPSHOT for all builds (dynamic
# prerelease tagging is handled later in the CI/CD pipeline).
appVersion = "1.0.0"
appPrerelease = "SNAPSHOT"

# --- AndroidX core ---
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"

# --- Compose ---
composeBom = "2026.05.00"

# --- DI ---
hilt = "2.57.1"
hiltAndroidx = "1.2.0"

# --- Navigation ---
navigation = "2.9.0"

# --- Network & Serialization ---
ktor = "3.4.3"
serialization = "1.10.0"

# --- Async ---
coroutines = "1.11.0"
immutableCollections = "0.3.8"

# --- Image loading ---
coil = "3.1.0"

# --- DI annotations (for the pure-Kotlin domain module) ---
javaxInject = "1"

# --- Storage ---
datastore = "1.1.2"

# --- Testing (unit) ---
junit5 = "5.11.4"
mockk = "1.13.14"
turbine = "1.2.0"

# --- Testing (instrumented — existing scaffold) ---
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# --- AndroidX core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Lifecycle & ViewModel ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Compose (resolved via BOM — no explicit version on the artifacts) ---
# Canonical short aliases (used by core/feature module build files):
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Existing scaffold aliases kept so :app keeps resolving unchanged:
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- Navigation ---
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# --- Hilt ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltAndroidx" }
# Overrides the kotlin-metadata-jvm bundled with Hilt 2.57.x so it can read Kotlin 2.3 metadata.
# Add as ksp(...) on EVERY Hilt module; version.ref = "kotlin" keeps it aligned with the compiler.
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

# --- Network (Ktor) & Serialization ---
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- Async ---
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutableCollections" }

# --- Image loading (Coil 3 — okhttp network fetcher auto-registers via ServiceLoader) ---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- DI annotations (javax.inject — for the pure-Kotlin domain module) ---
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

# --- Storage ---
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Testing (unit: JUnit5 + MockK + Turbine) ---
junit5-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
junit5-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Testing (instrumented — existing scaffold) ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# kotlin-android is intentionally NOT listed — AGP 9.x applies Kotlin automatically (built-in Kotlin).
# kotlin-jvm is for the pure-Kotlin core:domain module only (no AGP there).
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
