# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AndroidX is required for Compose / Hilt / Navigation.
android.useAndroidX=true

# --- AGP 9.x / Hilt 2.57.x compatibility workaround ---
# The Hilt 2.57.x Gradle plugin queries the legacy Android BaseExtension, which AGP 9 no
# longer creates under its new DSL — the build fails with "Android BaseExtension not found".
# Opt out of the new DSL so the legacy extension exists again. With the new DSL off, built-in
# Kotlin's source-set guard then rejects the KSP-generated source dirs, so it must be relaxed too.
#
# Do NOT set android.builtInKotlin=false — this project relies on AGP's built-in Kotlin and never
# applies org.jetbrains.kotlin.android. Do NOT add android.enableLegacyVariantApi either (removed
# in AGP 9.0). Remove both flags below once on Hilt 2.59.2+ (first release with native AGP 9 support).
android.newDsl=false
android.disallowKotlinSourceSets=false